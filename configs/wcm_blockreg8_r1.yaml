# B8：块注意力 register 融合（K_s=4 空间寄存 + K_t=4 时间寄存，同一注意力层）
# 时间维块内双向（block_size=2）、块间因果；ViT 内 register 关闭（由融合层统一接管）
# 对照组：C2/D2/T4/S4T4（合体失败组），协议（seed/数据/loss/lr/30ep）完全一致
output_dir: outputs/wcm_blockreg8_r1
seed: 3072
epochs: 30
per_device_batch_size: 8
eval_batch_size: 16
num_workers: 4
gradient_accumulation_steps: 1
max_grad_norm: 1.0
precision: bf16
log_every: 20
eval_every_epochs: 1
# 磁盘保护：每 5 ep 存一次 epoch checkpoint（1.5GB/个）
save_every_epochs: 5
expected_world_size: 1
ddp_timeout_minutes: 30
deterministic: false
init_from: null

data:
  repo_id: data_toiletButton_merged_0814_with_return
  root: /home/user/code_1/WCM/data_toiletButton_merged_0814_with_return
  revision: null
  image_keys:
    - observation.images.primary
    - observation.images.wrist
  action_key: action
  state_key: observation.state
  return_key: return
  history_size: 3
  prediction_horizon: 1
  val_fraction: 0.1
  split_seed: 3072
  normalize_action: true
  action_mean: null
  action_std: null
  normalization_epsilon: 1.0e-6

model:
  action_dim: null
  state_dim: null
  latent_dim: 384
  max_views: 16
  trunk_depth: 6
  trunk_heads: 8
  trunk_mlp_ratio: 4.0
  dropout: 0.1
  max_history: 16
  value_hidden_dim: 384
  dynamics_depth: 3
  action_hidden_dim: 384
  predict_state_vector: false
  # 块注意力 register 融合：时空寄存进同一层，块内双向/块间因果
  use_block_register_fusion: true
  num_spatial_registers: 4
  num_temporal_registers: 4
  register_block_size: 2
  # 稀疏未来泄漏：随机放行 5% 被屏蔽的未来 token（BigBird 式随机注意力）
  register_future_leak_ratio: 0.05
  vision:
    model_name: google/vit-base-patch16-224-in21k
    image_size: 224
    trainable: true
    pretrained: true
    # ViT 内 register 关闭：空间信息由融合层的空间寄存统一接管
    num_register_tokens: 0
  language:
    model_name: openai/clip-vit-base-patch32
    max_length: 77
    trainable: false
    pretrained: true
    fusion_layers: 2
    fusion_heads: 8
    fusion_dropout: 0.0

loss:
  value_weight: 1.0
  next_state_weight: 1.0
  next_state_vector_weight: 0.0
  sigreg_weight: 0.01
  sigreg_knots: 17
  sigreg_num_projections: 1024

optim:
  lr: 1.0e-5
  weight_decay: 1.0e-3
  betas: [0.9, 0.95]
  warmup_steps: 300
  min_lr_ratio: 0.1
  # 寄存 token 本体（*registers）单独 10x；融合层 attn 投影留主组 1x（吸取合体教训）
  register_lr_scale: 10.0
