# S4+T4 合体消融：空间 register（ViT 内 K=4）+ 时间 register（K_t=4）同时开
# 对比：C2(K=0/K_t=0) / D2(S=4) / T4(T=4)，唯一差异 = 两 register 同开，其余协议（seed/数据/loss/lr/30ep）完全一致
output_dir: outputs/wcm_s4t4_r1
seed: 3072
epochs: 30
per_device_batch_size: 8
eval_batch_size: 16
num_workers: 4
gradient_accumulation_steps: 1
max_grad_norm: 1.0
precision: bf16
log_every: 20
eval_every_epochs: 1
save_every_epochs: 1
expected_world_size: 1
ddp_timeout_minutes: 30
deterministic: false
init_from: null

data:
  repo_id: data_toiletButton_merged_0814_with_return
  root: /home/user/code_1/WCM/data_toiletButton_merged_0814_with_return
  revision: null
  image_keys:
    - observation.images.primary
    - observation.images.wrist
  action_key: action
  state_key: observation.state
  return_key: return
  history_size: 3
  prediction_horizon: 1
  val_fraction: 0.1
  split_seed: 3072
  normalize_action: true
  action_mean: null
  action_std: null
  normalization_epsilon: 1.0e-6

model:
  action_dim: null
  state_dim: null
  latent_dim: 384
  max_views: 16
  trunk_depth: 6
  trunk_heads: 8
  trunk_mlp_ratio: 4.0
  dropout: 0.1
  max_history: 16
  value_hidden_dim: 384
  dynamics_depth: 3
  action_hidden_dim: 384
  predict_state_vector: false
  # 时间 register：跨时间步共享，因果前缀交叉注意力吸收不变信息
  num_temporal_registers: 4
  vision:
    model_name: google/vit-base-patch16-224-in21k
    image_size: 224
    trainable: true
    pretrained: true
    # 空间 register 打开：消解单帧内 CLS->patch 注意力伪影
    num_register_tokens: 4
  language:
    model_name: openai/clip-vit-base-patch32
    max_length: 77
    trainable: false
    pretrained: true
    fusion_layers: 2
    fusion_heads: 8
    fusion_dropout: 0.0

loss:
  value_weight: 1.0
  next_state_weight: 1.0
  next_state_vector_weight: 0.0
  sigreg_weight: 0.01
  sigreg_knots: 17
  sigreg_num_projections: 1024

optim:
  lr: 1.0e-5
  weight_decay: 1.0e-3
  betas: [0.9, 0.95]
  warmup_steps: 300
  min_lr_ratio: 0.1
  # register 全新参数冷启动 10x（与 D2/T4 对齐；同时命中 register_tokens 与 temporal_registers 参数组）
  register_lr_scale: 10.0
