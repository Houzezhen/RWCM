# S4-State ablation: 28D sparse proprioception, current image only.
output_dir: /media/Data/user/WCM_outputs/wcm_sparse4_state_exp_s42
seed: 42
epochs: 10
per_device_batch_size: 8
eval_batch_size: 16
num_workers: 4
max_grad_norm: 1.0
precision: bf16
log_every: 20
eval_every_epochs: 1
save_every_epochs: 5
expected_world_size: 1
data:
  repo_id: data_toiletButton_0814_expanded_with_return
  root: /home/user/.cache/huggingface/lerobot/test/data_toiletButton_0814_expanded_with_return
  image_keys: [observation.images.primary, observation.images.wrist]
  action_key: action
  state_key: observation.state
  return_key: return
  history_size: 1
  history_offsets: [0, 20, 40, 60]
  history_mosaic: false
  prediction_horizon: 1
  val_fraction: 0.1
  split_seed: 3072
  normalize_action: true
model:
  latent_dim: 384
  max_views: 16
  trunk_depth: 6
  trunk_heads: 8
  trunk_mlp_ratio: 4.0
  dropout: 0.1
  max_history: 16
  value_hidden_dim: 384
  dynamics_depth: 3
  action_hidden_dim: 384
  use_proprioception: true
  proprioception_dim: 28
  vision: {model_name: google/vit-base-patch16-224-in21k, image_size: 224, trainable: true, pretrained: true, num_register_tokens: 0}
  language: {model_name: openai/clip-vit-base-patch32, max_length: 77, trainable: false, pretrained: true, fusion_layers: 2, fusion_heads: 8, fusion_dropout: 0.0}
loss: {value_weight: 1.0, next_state_weight: 1.0, sigreg_weight: 0.01, sigreg_knots: 17, sigreg_num_projections: 1024}
optim: {lr: 1.0e-5, weight_decay: 1.0e-3, betas: [0.9, 0.95], warmup_steps: 300, min_lr_ratio: 0.1}
